name: iteronix

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

  server-api:
    build:
      context: .
      dockerfile: apps/server-api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ITERONIX_ADMIN_EMAIL: ${ITERONIX_ADMIN_EMAIL:-admin@admin}
      ITERONIX_ADMIN_PASSWORD: ${ITERONIX_ADMIN_PASSWORD:-admin}
      IDE_UI_ORIGINS: ${IDE_UI_ORIGINS:-http://localhost:${ITERONIX_HTTP_PORT:-4000},http://127.0.0.1:${ITERONIX_HTTP_PORT:-4000}}
      # Extend the server-owned plugin allowlist (reference.echo is always trusted).
      ITERONIX_TRUSTED_PLUGIN_IDS: ${ITERONIX_TRUSTED_PLUGIN_IDS:-}
      # Optional: only needed by programmatic callers. The web UI signs in.
      AUTH_TOKEN: ${AUTH_TOKEN:-}
    restart: unless-stopped
    ports:
      - "${ITERONIX_HTTP_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4000/"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
