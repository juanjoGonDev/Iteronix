name: CI

on:
  push:
    branches:
      - master
      - codex/**
      - refactor/**
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web-ui exec puppeteer browsers install chrome
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm -C apps/web-ui validate:settings
      - run: pnpm -C apps/web-ui validate:workflows
      - name: Validate colocated Docker workflow UI
        env:
          POSTGRES_DB: iteronix_ci
          POSTGRES_USER: iteronix_ci
          POSTGRES_PASSWORD: iteronix_ci_password
          AUTH_TOKEN: iteronix_ci_internal_token
          ITERONIX_HTTP_PORT: 4002
        run: |
          docker compose up --build --detach --wait
          curl --fail --silent --show-error http://localhost:4002/workflows/workflow-ci | grep '<script type="module" src="/dist/index.js"></script>'
          docker compose down --volumes
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-ui-browser-validation-screenshots
          path: apps/web-ui/screenshots/
          if-no-files-found: ignore
